
name: Daily Taiwan Stock Update

on:
  schedule:
    - cron: '15 19 * * 1-5'
      timezone: 'Asia/Taipei'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-daily-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Download market snapshots and update PostgreSQL
        run: python -m scripts.update --require-remote
